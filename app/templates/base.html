<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CREW 学习工作台{% endblock %}</title>
  <!-- 主题必须**在样式生效之前**定下来，否则会先闪一下另一种底色。
       优先级：上次手动选的 → 系统偏好 → 明色（白天阅读为主）。
       放在这里而不是 js/theme.js 里，是因为那是一个 module 脚本——
       module 是延迟执行的，等它跑到，底色已经画出来了。 -->
  <script>
    (function () {
      var theme = "light";
      try {
        theme = localStorage.getItem("crew-theme")
          || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (err) {
        /* 隐私模式下读不到 localStorage：退回系统偏好 */
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <!-- 左栏折叠状态同理：它是个纯界面状态，但**也必须在首屏之前定下来**。
       放到 module 脚本里的话，展开状态会先画出来再跳成折叠——一次可见的抖动。 -->
  <script>
    (function () {
      try {
        if (localStorage.getItem("crew-rail") === "collapsed") {
          document.documentElement.dataset.rail = "collapsed";
        }
      } catch (err) {
        /* 读不到就不折叠：默认状态本来就是展开 */
      }
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body data-page="{{ page }}">

<!-- 窗口顶栏：品牌 + 当前状态 + 主题开关。
     导航**不在这里**——它在左边那一列（见下）。顶栏只回答"这是什么、现在能不能用"。 -->
<header class="topbar">
  <a class="brand" href="/"><span class="brand-name">CREW</span> <span class="brand-sub">· 学习工作台</span></a>
  <div class="topbar-status">
    <!-- 环境就绪状态。它**同时是一个入口**：写着"未配置密钥"的时候，
         用户下一步要做的正是去设置里填——所以点它就该到那儿去，
         而不是给一个不能点的标签让人自己找。 -->
    <a id="env" class="badge" href="/settings" title="打开设置">检查环境</a>
    <!-- 折叠左栏的开关**不在顶栏**了——它搬到左栏最上面那一行（见下面的
         `.rail-sticky`）。理由：它管的就是左栏，手和眼睛本来就在那一列上；
         而且放在那一列的最上面，折叠之后它自己仍然点得到。 -->
    <!-- 深浅主题开关：图标显示的是**当前**主题（暗色下给月亮） -->
    <button id="theme-toggle" class="theme-toggle" type="button"
            aria-label="切换深浅主题" title="切换深浅主题">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>
      </svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
    </button>
  </div>
</header>

<!-- 外壳：左边一列目的地，右边是页面内容。
     这就是"客户端"与"网页"在形状上的差别——导航有固定的位置，
     而不是跟着每个页面的内容一起往下流。 -->
<div class="shell" id="shell">
  <nav class="rail-nav" aria-label="主导航">
   <div class="rail-sticky">
    <!-- 折叠开关：占导航列的第一行。
         它是"动作"而不是"去哪"，所以没有 `aria-current`；箭头方向由 CSS 按
         `<html data-rail>` 二选一（见 app.css 里 `.nav-toggle` 那段）。
         类名**不能**叫 `rail-toggle`——那已经是课程页进度尺那个按钮的类名了。 -->
    <button class="rail-item nav-toggle" id="nav-toggle" type="button"
            aria-expanded="true" aria-controls="shell" title="折叠左栏">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <path d="M9.5 4v16"/>
        <path class="i-collapse" d="M15.5 9.5L13.5 12l2 2.5"/>
        <path class="i-expand" d="M13.5 9.5L15.5 12l-2 2.5"/>
      </svg>
      <span class="label">折叠</span>
    </button>

    <a class="rail-item" href="/" title="课程"
       {% if page == 'dashboard' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/>
        <path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 1 4 20.5z"/>
      </svg>
      <span class="label">课程</span>
    </a>

    <a class="rail-item" href="/notes" title="讲义"
       {% if page == 'notes' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M7 3h7l4 4v14H7z"/>
        <path d="M14 3v4h4"/>
        <path d="M10 12.5h6M10 16.5h6"/>
      </svg>
      <span class="label">讲义</span>
    </a>

    <a class="rail-item" href="/settings" title="设置"
       {% if page == 'settings' %}aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
      </svg>
      <span class="label">设置</span>
    </a>
   </div>
  </nav>

  <div class="shell-body">
    {% block body %}{% endblock %}
  </div>
</div>

<!-- 主题开关、界面偏好、全局快捷键、页面自己的脚本。
     顺序有意义：前面几个都是"整站共用"的，先加载它们，
     页面脚本才可能用到它们（现在没有用到，但顺序对了将来就不用改）。 -->
<script type="module" src="{{ url_for('static', filename='js/prefs.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/theme.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/keys.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/views/' ~ page ~ '.js') }}"></script>
</body>
</html>
